*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body.animal-bg{background:linear-gradient(135deg,#0c1929,#1a365d,#234e52)}

#sub-tabs{display:flex;gap:4px;flex-shrink:0;flex-wrap:nowrap;justify-content:center;z-index:10;width:100%;max-width:100%;overflow-x:auto;padding:2px 0;margin-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-height:28px}

.sub-tab.active{border-color:#ffd700;background:rgba(255,215,0,.12);color:#ffd700}
.sub-tab:active{transform:scale(.92)}
#main-area{flex:1;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-height:0;gap:0}
#img-card{width:240px;height:240px;border-radius:24px;background:rgba(255,255,255,.04);backdrop-filter:blur(24px);border:3px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s;z-index:5;box-shadow:0 16px 48px rgba(0,0,0,.3)}

#img-card .color-block{width:80%;height:80%;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:80px;font-weight:800;color:#fff;text-shadow:0 4px 12px rgba(0,0,0,.4);box-shadow:0 8px 32px rgba(0,0,0,.3)}
#word-text{color:#fff;font-family:'Fredoka One',cursive;font-size:48px;font-weight:800;text-align:center;line-height:1.1;margin:4px 0 2px;z-index:10;cursor:pointer;transition:all .3s;letter-spacing:1px}

#word-text.fruit-text{background:linear-gradient(135deg,#7bed9f,#2ed573,#ffa502);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(46,213,115,.4))}
#word-text.sensory-text{background:linear-gradient(135deg,#c084fc,#f472b6,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(192,132,252,.4))}
#word-text.size-text{background:linear-gradient(135deg,#60a5fa,#34d399,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(96,165,250,.4))}
#word-text.feelings-text{background:linear-gradient(135deg,#f472b6,#fb923c,#f87171);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(244,114,182,.4))}
#word-text.all-text{background:linear-gradient(135deg,#ffd700,#ff9ff3,#48dbfb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(255,215,0,.4))}
#word-text.logic-text{background:linear-gradient(135deg,#a78bfa,#67e8f9,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(167,139,250,.4))}
#word-text.body-text{background:linear-gradient(135deg,#ff9999,#ff6b6b,#ff4757);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(255,107,107,.4))}
#word-text.food-text{background:linear-gradient(135deg,#7bed9f,#2ed573,#ffa502);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(46,213,115,.4))}
#word-text.home-text{background:linear-gradient(135deg,#ffd700,#f0e68c,#daa520);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(255,215,0,.4))}
#word-text.actions-text{background:linear-gradient(135deg,#74b9ff,#48dbfb,#0abde3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(116,185,255,.4))}
#word-text.pop{animation:textPop .5s ease-out}
@keyframes textPop{0%{transform:scale(.7)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;font-size:20px;color:rgba(255,255,255,.4);transition:all .2s}
.arrow:active{background:rgba(255,215,0,.2);border-color:#ffd700;color:#ffd700;transform:translateY(-50%) scale(.82)}
#arrow-left{left:0}#arrow-right{right:0}
#counter{color:rgba(255,255,255,.2);font-size:12px;flex-shrink:0;cursor:pointer;padding:6px 16px;border-radius:14px;margin-top:2px;z-index:10}
#counter span{color:#ffd700;font-weight:700;font-size:15px}
#autoplay{position:absolute;top:0;right:2px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;z-index:20;color:rgba(255,255,255,.3);transition:all .2s}

@media(max-width:360px){#img-card{width:200px;height:200px}#word-text{font-size:40px}}

<script>
// ═══════════════════════════════════════════
//  DATA — complete category tree
// ═══════════════════════════════════════════

// Helper: image path for adjective
function adjImg(w) {
  const lower = w.toLowerCase();
  // All words using clean SVG files (Twemoji + custom SVGs in images/adjectives/)
  const svgWords = [
    // Emotion (8)
    'happy','sad','angry','surprised','brave','scared','silly','serious',
    // Shape (7)
    'round','flat','square','pointed','curved','straight','crooked',
    // Logic (10)
    'same','different','alike','first','last','middle','next','simple','hard','tricky',
    // Touch (8)
    'hard','soft','fuzzy','prickly','slimy','sticky','freezing','boiling',
    // Weight (5)
    'heavy','light','strong','weak','sturdy',
    // Visual (7)
    'bright','dark','shiny','dull','clear','colorful','pale',
    // Sound (6)
    'loud','quiet','noisy','silent','squeaky','whispering',
    // Size (11)
    'big','small','tall','short','long','tiny','huge','wide','narrow','thick','thin',
    // Speed (4)
    'fast','slow','quick','rapid',
    // Condition (10)
    'clean','dirty','broken','fixed','new','old','wet','dry','empty','full',
    // Opinion (9)
    'good','bad','pretty','ugly','mean','nice','difficult','easy','important'
  ];
  if (svgWords.includes(lower)) return 'images/adjectives/' + lower + '.svg';
  // hot uses JPG
  if (lower === 'hot') return 'images/adj_hot.jpg';
  // cold and a few others still use GIF
  return 'images/adjectives/' + lower + '.gif';
}

function adjAud(w) {
  return 'audio/adj_' + w.toLowerCase() + '.mp3';
}

// Color block HTML (no image file)
function colorBlock(name) {
  const colors = {Red:'#ff4444',Blue:'#4488ff',Green:'#44cc44',Yellow:'#ffdd44',Orange:'#ff8844',Purple:'#aa44ff'};
  return '<div class="color-block" style="background:'+(colors[name]||'#888')+'">' + name.charAt(0) + '</div>';
}

function phraseEmoji(emoji) {
  return '<div style="font-size:100px;text-align:center;line-height:1">' + emoji + '</div>';
}

function phraseItem(text, emoji, fname) {
  return {w:text, emoji:phraseEmoji(emoji), aud:'audio/phrase_'+fname+'.mp3'};
}

function w(w) { return w; }
function img(w,p) { return {w,img:p,aud:'audio/'+w.toLowerCase()+'.mp3'}; }
function adj(w) { return {w,img:adjImg(w),aud:adjAud(w)}; }

const DATA = {

    words: [

    words: [

      },

      },

        label:'Sound',
        words:[adj('Loud'),adj('Quiet'),adj('Noisy'),adj('Silent'),adj('Squeaky'),adj('Whispering')]

    }
  },
  size: {
    label: '📏 Size',
    subcats: {
      size: {
        label:'Size',
        words:[adj('Big'),adj('Small'),adj('Tall'),adj('Short'),adj('Long'),adj('Tiny'),adj('Huge'),adj('Wide'),adj('Narrow'),adj('Thick'),adj('Thin')]
      },
      form: {
        label:'Form',
        words:[adj('Round'),adj('Flat'),adj('Square'),adj('Pointed'),adj('Curved'),adj('Straight'),adj('Crooked')]
      },
      speed: {
        label:'Speed',
        words:[adj('Fast'),adj('Slow'),adj('Quick'),adj('Rapid')]
      }
    }
  },
  feelings: {
    label: '💭 Feelings',
    subcats: {
      emotion: {
        label:'Emotion',
        words:[adj('Happy'),adj('Sad'),adj('Angry'),adj('Surprised'),adj('Brave'),adj('Scared'),adj('Silly'),adj('Serious')]
      },
      opinion: {
        label:'Opinion',
        words:[adj('Good'),adj('Bad'),adj('Pretty'),adj('Ugly'),adj('Mean'),adj('Nice'),adj('Difficult'),adj('Easy'),adj('Important')]
      },

        words:[adj('Clean'),adj('Dirty'),adj('Broken'),adj('Fixed'),adj('New'),adj('Old'),adj('Wet'),adj('Dry'),adj('Empty'),adj('Full')]
      }
    }
  },

    subcats: {

      img('Head','images/head.svg'), img('Arm','images/arm.svg')

  },

    gradClass: 'food',
    words: [
      img('Bread','images/bread.svg'), img('Cake','images/cake.svg'), img('Cookie','images/cookie.svg'),
      img('Milk','images/milk.svg'), img('Egg','images/egg.svg'), img('Cheese','images/cheese.svg'),
      img('Rice','images/rice.svg'), img('Water','images/water.svg'), img('Candy','images/candy.svg'),

    label: '🏠 Home',
    gradClass: 'home',
    words: [
      img('Bed','images/bed.svg'), img('Chair','images/chair.svg'), img('Table','images/table.svg'),
      img('Door','images/door.svg'), img('Window','images/window.svg'), img('Cup','images/cup.svg'),

      img('Run','images/run.svg'), img('Jump','images/jump.svg'), img('Walk','images/walk.svg'),
      img('Sit','images/sit.svg'), img('Stand','images/stand.svg'), img('Clap','images/clap.svg'),
      img('Wave','images/wave.svg')

  },
  phrases: {
    label: '💬 Phrases',
    gradClass: 'logic',
    subcats: {
      greetings: {
        label:'Greetings',
        words:[
          phraseItem('Hello!','👋','hello'),
          phraseItem('Goodbye!','👋','goodbye'),
          phraseItem('Good morning','☀️','good_morning'),
          phraseItem('Good night','🌙','good_night'),
          phraseItem('How are you?','🤔','how_are_you'),
          phraseItem("I'm fine","😊",'im_fine')
        ]
      },
      responses: {
        label:'Responses',
        words:[
          phraseItem('Thank you','🙏','thank_you'),

          phraseItem('Please','🥺','please'),
          phraseItem('Sorry','😔','sorry'),

          phraseItem('No','🙅','no')
        ]
      },

        label:'Actions',
        words:[
          phraseItem('I love you','❤️','i_love_you'),

};

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
const state = {
  mainCat: 'all',      // 'all' or any key from DATA
  subCat: null,        // sub-category key (e.g. 'touch') or null for flat categories
  index: 0,
  autoplay: false,
  autoplayTimer: null,
  currentAudio: null,
  volume: 0.8
};

// ═══════════════════════════════════════════
//  COMPUTED
// ═══════════════════════════════════════════
function getCurrentWords() {
  if (state.mainCat === 'all') {
    // All words from all categories
    let all = [];
    for (const key in DATA) {
      const cat = DATA[key];
      if (cat.subcats) {
        for (const sk in cat.subcats) {
          all = all.concat(cat.subcats[sk].words);
        }
      } else {
        all = all.concat(cat.words);
      }
    }
    return all;
  }
  const cat = DATA[state.mainCat];
  if (!cat) return [];
  if (cat.subcats) {
    if (state.subCat && cat.subcats[state.subCat]) {
      return cat.subcats[state.subCat].words;
    }
    // Default to first subcat
    const firstKey = Object.keys(cat.subcats)[0];
    if (firstKey) {
      // Auto-set subCat if not set
      if (!state.subCat) state.subCat = firstKey;
      return cat.subcats[firstKey].words;
    }
    return [];
  }
  return cat.words;
}

function getCurrentWord() {
  const words = getCurrentWords();
  return words.length > 0 ? words[state.index] : null;
}

function getTotal() {
  return getCurrentWords().length;
}

function getCategoryClass() {
  const map = {animal:'animal', color:'color', fruit:'fruit', sensory:'sensory', size:'size', feelings:'feelings', logic:'logic', body:'body', food:'food', home:'home', actions:'actions', phrases:'logic'};
  if (state.mainCat === 'all') return 'all';
  return map[state.mainCat] || 'all';
}

function getBackgroundClass() {
  const map = {animal:'animal-bg', color:'color-bg', fruit:'fruit-bg', sensory:'sensory-bg', size:'size-bg', feelings:'feelings-bg', logic:'logic-bg', body:'body-bg', food:'food-bg', home:'home-bg', actions:'actions-bg', phrases:'logic-bg'};
  if (state.mainCat === 'all') return 'all-bg';
  return map[state.mainCat] || 'all-bg';
}

// ═══════════════════════════════════════════
//  VIEW
// ═══════════════════════════════════════════
const $ = id => document.getElementById(id);

function render() {
  const word = getCurrentWord();
  const total = getTotal();
  const cls = getCategoryClass();

  // Image card
  const card = $('img-card');
  if (word) {
    if (state.mainCat === 'color' || (state.mainCat === 'all' && word.w && ['Red','Blue','Green','Yellow','Orange','Purple'].includes(word.w) && !word.img)) {
      card.innerHTML = colorBlock(word.w);
    } else if (word.emoji) {
      card.innerHTML = word.emoji; // phraseEmoji is already evaluated at DATA build time
    } else if (word.img) {
      card.innerHTML = `<img src="${word.img}" alt="${word.w}" onerror="this.style.display='none'">`;
    } else {
      card.innerHTML = '';
    }
  } else {
    card.innerHTML = '<div style="color:rgba(255,255,255,.2);font-size:60px">?</div>';
  }

  // Word text
  const wt = $('word-text');
  if (word) {
    wt.textContent = word.w;
    wt.className = cls + '-text';
  } else {
    wt.textContent = '';
    wt.className = '';
  }

  // Counter
  $('idx-num').textContent = total > 0 ? (state.index + 1) : 0;
  $('total-num').textContent = total;

  // Background
  document.body.className = getBackgroundClass();

  // Main tabs — rebuild to keep active state in sync
  renderMainTabs();

  // Sub-tabs
  renderSubTabs();
}

function renderMainTabs() {
  const container = $('tabs');
  const keys = Object.keys(DATA);
  // Build tabs: 'All' first, then each category
  let html = `<button class="tab${state.mainCat === 'all' ? ' active' : ''}" data-cat="all">🌍 All</button>`;
  for (const k of keys) {
    const cat = DATA[k];
    html += `<button class="tab${k === state.mainCat ? ' active' : ''}" data-cat="${k}">${cat.label}</button>`;
  }
  container.innerHTML = html;
  // Re-bind tab clicks
  container.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => setMainCat(btn.dataset.cat));
  });
}

function renderSubTabs() {
  const container = $('sub-tabs');
  const cat = DATA[state.mainCat];
  if (!cat || !cat.subcats) {
    container.innerHTML = '';
    return;
  }
  const keys = Object.keys(cat.subcats);
  container.innerHTML = keys.map(k =>
    `<button class="sub-tab${k === state.subCat ? ' active' : ''}" data-sub="${k}">${cat.subcats[k].label}</button>`
  ).join('');

  // Re-bind sub-tab clicks
  container.querySelectorAll('.sub-tab').forEach(btn => {
    btn.addEventListener('click', () => setSubCat(btn.dataset.sub));
  });
}

function bounceCard() {
  const c = $('img-card');
  if (!c) return;
  c.style.transform = 'scale(.92)';
  setTimeout(() => c.style.transform = 'scale(1.05)', 100);
  setTimeout(() => c.style.transform = 'scale(1)', 220);
}

function popText() {
  const t = $('word-text');
  if (!t) return;
  t.classList.remove('pop');
  void t.offsetWidth;
  t.classList.add('pop');
}

function confetti(n) {
  n = n || 20;
  const colors = ['#ff6b6b','#ffd700','#a55eea','#4ade80','#60a5fa','#fbbf24','#ff9ff3','#ff6348'];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'confetti-piece';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.top = '-20px';
    d.style.background = colors[Math.floor(Math.random() * colors.length)];
    d.style.width = (6 + Math.random() * 12) + 'px';
    d.style.height = (6 + Math.random() * 12) + 'px';
    d.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
    d.style.animationDelay = Math.random() * 0.4 + 's';
    d.style.animationDuration = (1 + Math.random() * 1.2) + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2000);
  }
}

function toggleAutoplayUI(on) {
  $('autoplay').textContent = on ? '⏸' : '▶';
  $('autoplay').classList.toggle('active', on);
}

// ═══════════════════════════════════════════
//  CONTROLLER
// ═══════════════════════════════════════════

function setMainCat(cat) {
  if (cat === state.mainCat) return;
  state.mainCat = cat;
  state.subCat = null;
  state.index = 0;
  render();
  if (state.autoplay) scheduleAutoplay();
}

function setSubCat(sub) {
  state.subCat = sub;
  state.index = 0;
  render();
  if (state.autoplay) scheduleAutoplay();
}

function prev() {
  const total = getTotal();
  if (total === 0) return;
  state.index = state.index > 0 ? state.index - 1 : total - 1;
  render();
  if (state.autoplay) scheduleAutoplay();
}

function next() {
  const total = getTotal();
  if (total === 0) return;
  state.index = state.index < total - 1 ? state.index + 1 : 0;
  render();
  if (state.autoplay) scheduleAutoplay();
}

function tapWord() {
  const word = getCurrentWord();
  if (!word) return;
  playAudio();
  confetti(20);
  bounceCard();
  popText();
}

function playAudio() {
  const word = getCurrentWord();
  if (!word) return;
  if (!word.aud) return;
  if (state.currentAudio) {
    state.currentAudio.pause();
    state.currentAudio = null;
  }
  const a = new Audio(word.aud);
  a.volume = state.volume;
  state.currentAudio = a;
  a.onended = () => {
    if (state.autoplay) setTimeout(() => next(), 600);
  };
  a.play().catch(() => {});
}

function toggleAutoplay() {
  state.autoplay = !state.autoplay;
  toggleAutoplayUI(state.autoplay);
  if (state.autoplay) scheduleAutoplay();
  else {
    clearTimeout(state.autoplayTimer);
    if (state.currentAudio) {
      state.currentAudio.pause();
      state.currentAudio = null;
    }
  }
}

function scheduleAutoplay() {
  clearTimeout(state.autoplayTimer);
  state.autoplayTimer = setTimeout(() => {
    tapWord();
    // Don't hard-code next() — audio ended event handles advancement
  }, 800);
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
function init() {
  // Build main tabs dynamically from DATA
  renderMainTabs();

  // Arrow clicks
  $('arrow-left').addEventListener('click', prev);
  $('arrow-right').addEventListener('click', next);

  // Card click → play audio
  $('img-card').addEventListener('click', tapWord);

  // Word text click → also play
  $('word-text').addEventListener('click', tapWord);

  // Autoplay
  $('autoplay').addEventListener('click', toggleAutoplay);

  // Swipe
  let tx = 0;
  $('main-area').addEventListener('touchstart', e => { tx = e.touches[0].clientX; });
  $('main-area').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 50) {
      dx < 0 ? next() : prev();
    }
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'ArrowRight') next();
    if (e.key === ' ') { e.preventDefault(); tapWord(); }
  });

  // Volume long-press on counter
  let pt;
  $('counter').addEventListener('pointerdown', () => {
    pt = setTimeout(() => {
      state.volume = state.volume > 0.5 ? 0.2 : 0.8;
      playAudio();
    }, 2500);
  });
  $('counter').addEventListener('pointerup', () => clearTimeout(pt));
  $('counter').addEventListener('pointerleave', () => clearTimeout(pt));

  // Random start
  const total = getTotal();
  if (total > 0) state.index = Math.floor(Math.random() * total);

  // Initial render
  render();
}

// Boot
document.addEventListener('DOMContentLoaded', init);
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  init();
}
</script>
</body>
</html>
