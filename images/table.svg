<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <!-- Table top -->
  <rect x="6" y="20" width="60" height="8" rx="2" fill="#8B4513" stroke="#5D2E0C" stroke-width="1.5"/>
  <!-- Table legs -->
  <rect x="10" y="28" width="4" height="30" rx="1.5" fill="#A0522D" stroke="#5D2E0C" stroke-width="1"/>
  <rect x="58" y="28" width="4" height="30" rx="1.5" fill="#A0522D" stroke="#5D2E0C" stroke-width="1"/>
  <!-- Apple on table -->
  <circle cx="24" cy="18" r="6" fill="#FF4444" stroke="#CC0000" stroke-width="1"/>
  <!-- Book on table -->
  <rect x="36" y="14" width="14" height="10" rx="1" fill="#4A90D9" stroke="#2C5F8A" stroke-width="1"/>
  <line x1="36" y1="14" x2="36" y2="24" stroke="#2C5F8A" stroke-width="1"/>
  <!-- Plate -->
  <ellipse cx="52" cy="22" rx="7" ry="3" fill="#E8E8E8" stroke="#CCCCCC" stroke-width="1"/>
</svg>
