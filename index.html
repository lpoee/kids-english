<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body.sensory-bg{background:linear-gradient(135deg,#1a0e1e,#3a1a3e,#2a1a4e)}

body.feelings-bg{background:linear-gradient(135deg,#2e0e1a,#4e1a3a,#3e0e2a)}

#app{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;position:relative;padding:0;overflow:hidden}
#tabs{display:flex;gap:4px;flex-shrink:0;flex-wrap:nowrap;justify-content:flex-start;z-index:100;overflow-x:auto;width:100%;max-width:100%;padding:6px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:absolute;top:0;left:0;background:linear-gradient(rgba(0,0,0,.5),transparent);pointer-events:auto}
#tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:rgba(255,255,255,.06);color:rgba(255,255,255,.45);font-size:11px;font-weight:700;cursor:pointer;transition:all .25s;border-radius:14px;padding:6px 10px;border:2px solid transparent;white-space:nowrap;flex-shrink:0}
.tab.active{border-color:#ffd700;background:rgba(255,215,0,.15);color:#ffd700;box-shadow:0 0 20px rgba(255,215,0,.2)}
.tab:active{transform:scale(.93)}
/* Sub-tabs */
#sub-tabs{display:flex;gap:4px;flex-shrink:0;flex-wrap:nowrap;justify-content:flex-start;z-index:100;width:100%;max-width:100%;overflow-x:auto;padding:6px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-height:28px;position:absolute;top:38px;left:0;background:linear-gradient(rgba(0,0,0,.3),transparent);pointer-events:auto}
#sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{border:none;background:rgba(255,255,255,.05);color:rgba(255,255,255,.35);font-size:10px;font-weight:600;cursor:pointer;transition:all .2s;border-radius:20px;padding:4px 12px;border:1.5px solid transparent;white-space:nowrap;flex-shrink:0;text-transform:uppercase;letter-spacing:.5px}
.sub-tab.active{border-color:#ffd700;background:rgba(255,215,0,.12);color:#ffd700}
.sub-tab:active{transform:scale(.92)}
#main-area{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-height:0;gap:0}
#img-card{width:min(100vw, calc(100vh - 120px));height:min(100vw, calc(100vh - 120px));max-width:100vw;max-height:calc(100vh - 120px);aspect-ratio:1/1;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));cursor:pointer;position:relative;overflow:hidden;transition:transform .15s;z-index:5;border-radius:26px;border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 60px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.16)}
#img-card::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 22%,rgba(6,18,32,.08) 75%,rgba(6,18,32,.24));pointer-events:none;z-index:2}
#img-card.no-image-stage{background:rgba(255,255,255,.04);border:3px solid rgba(255,255,255,.08);box-shadow:0 16px 48px rgba(0,0,0,.3);backdrop-filter:blur(24px)}
#img-card.no-image-stage::before{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 24%,rgba(6,18,32,.08) 78%,rgba(6,18,32,.18))}

#img-container{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;padding:26px 26px 98px;background:
radial-gradient(circle at 50% 18%,rgba(255,255,255,.22),rgba(255,255,255,0) 34%),
radial-gradient(circle at 20% 20%,rgba(255,255,255,.12),rgba(255,255,255,0) 22%),
linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01))}
#img-container.photo-stage{padding:14px 14px 92px;background:transparent}
#img-container.no-image-stage{padding:0;background:transparent}
#img-container img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 28px rgba(0,0,0,.24))}
#img-container img.photo-asset{width:92%;height:92%;padding:18px;background:rgba(255,255,255,.62);border-radius:28px;box-shadow:0 12px 32px rgba(15,23,42,.16)}
#img-container.photo-stage img.photo-asset{width:100%;height:100%;padding:0;background:transparent;border-radius:24px;box-shadow:none}
#img-container img.generated-asset{width:100%;height:100%}
#img-container img.vector-asset{width:94%;height:94%}
#img-container .color-stage{width:100%;height:100%;border-radius:32px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--color-soft),var(--color));box-shadow:inset 0 18px 30px rgba(255,255,255,.24)}
#img-container .color-stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 24%,rgba(255,255,255,.55),rgba(255,255,255,0) 30%)}

#img-container .color-swatch{width:46%;aspect-ratio:1;border-radius:38%;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.05));border:8px solid rgba(255,255,255,.24);box-shadow:0 20px 36px rgba(8,15,28,.18);position:relative;display:flex;align-items:center;justify-content:center}

#img-container .fallback-stage{width:100%;height:100%;border-radius:32px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px;background:var(--fallback-bg);box-shadow:inset 0 18px 30px rgba(255,255,255,.18)}

#word-text.feelings-text{background:linear-gradient(135deg,#f472b6,#fb923c,#f87171);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(244,114,182,.4))}
#word-text.all-text{background:linear-gradient(135deg,#ffd700,#ff9ff3,#48dbfb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(255,215,0,.4))}
#word-text.logic-text{background:linear-gradient(135deg,#a78bfa,#67e8f9,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(167,139,250,.4))}
#word-text.body-text{background:linear-gradient(135deg,#ff9999,#ff6b6b,#ff4757);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(255,107,107,.4))}
#word-text.food-text{background:linear-gradient(135deg,#7bed9f,#2ed573,#ffa502);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(46,213,115,.4))}
#word-text.home-text{background:linear-gradient(135deg,#ffd700,#f0e68c,#daa520);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(255,215,0,.4))}
#word-text.actions-text{background:linear-gradient(135deg,#74b9ff,#48dbfb,#0abde3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 8px rgba(116,185,255,.4))}
#word-text.pop{animation:textPop .5s ease-out}
@keyframes textPop{0%{transform:scale(.7)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:15;font-size:22px;color:rgba(255,255,255,.7);transition:all .2s;backdrop-filter:blur(4px)}
.arrow:active{background:rgba(255,215,0,.3);border-color:#ffd700;color:#ffd700;transform:translateY(-50%) scale(.82)}
#arrow-left{left:8px}#arrow-right{right:8px}
#counter{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.5);font-size:12px;cursor:pointer;padding:4px 14px;border-radius:20px;z-index:15;background:rgba(0,0,0,.2);backdrop-filter:blur(4px)}
#counter span{color:#ffd700;font-weight:700;font-size:15px}
#autoplay{position:absolute;top:80px;right:8px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.1);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;z-index:20;color:rgba(255,255,255,.6);transition:all .2s;backdrop-filter:blur(4px)}
#autoplay.active{background:rgba(255,215,0,.2);border-color:#ffd700;color:#ffd700}
.confetti-piece{position:fixed;pointer-events:none;z-index:400;animation:cf 1.4s ease-out forwards}
@keyframes cf{0%{opacity:1;transform:translateY(0) rotate(0) scale(1)}100%{opacity:0;transform:translateY(100vh) rotate(800deg) scale(.2)}}
@media(max-width:360px){#word-text{font-size:36px}}

<script>
// ═══════════════════════════════════════════
//  DATA — complete category tree
// ═══════════════════════════════════════════

function adjAud(w) {
  return 'audio/adj_' + w.toLowerCase() + '.mp3';
}

function slugify(text) {
  return text.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}

function generatedImg(kind, slug, ext = 'jpg') {
  return 'images/generated/' + kind + '/' + slug + '.' + ext + '?v=29';
}

function vocabImg(value) {
  return generatedImg('vocab', slugify(value));
}

function adjImg(w) {
  const slug = slugify(w);
  const exactShapes = new Set(['round','square','circle','triangle','rectangle','oval','star','heart','diamond','pentagon','hexagon']);
  return generatedImg('adjs', slug, exactShapes.has(slug) ? 'png' : 'jpg');
}

const PHRASE_GIF_SLUGS = new Set([
  'wake_up','get_up','brush_teeth','wash_face','wash_hands','get_dressed',
  'put_on_shoes','take_off_shoes','clean_up','bath_time','go_to_sleep',
  'lets_go','lets_play','my_turn','your_turn','share_please','slow_down',
  'sit_down','stand_up','line_up','raise_your_hand','try_again',
  'come_here','go_there','put_it_here','give_me','show_me','touch','point_to'
]);

const APPROVED_PHRASE_JPGS = new Set([
  'bath_time','brush_teeth','can_you_help_me','clean_up','close','get_dressed','hello',
  'i_dont_know','i_like_it','i_want','im_angry','im_happy','im_sad','im_scared',
  'im_thirsty','im_tired','its_okay','lets_play','listen','no_more','point_to',
  'put_it_here','put_on_shoes','quiet_please','show_me','sit_down','stand_up','stop',
  'take_off_shoes','thats_funny','time_to_eat','touch','wash_face','wash_hands'
]);

function phraseImg(fname) {
  return generatedImg('phrases', fname, APPROVED_PHRASE_JPGS.has(fname) ? 'jpg' : 'svg');
}

function literalImg(w) {
  return vocabImg(w);
}

function literalItem(w) {
  return {w, img:literalImg(w), aud:'audio/' + slugify(w) + '.mp3'};
}

function literalWords(words) {
  return words.map(literalItem);
}

function phraseItem(text, fname) {
  return {w:text, img:phraseImg(fname), aud:'audio/phrase_'+fname+'.mp3'};
}

function emojiItem(w, emoji) {
  return {w, img:generatedImg('emoji', slugify(w)), aud:'audio/' + slugify(w) + '.mp3'};
}

function actionItem(w) {
  return {w, img:vocabImg(w), aud:'audio/' + slugify(w) + '.mp3'};
}

function adjItem(w) {
  return {w, img:adjImg(w), aud:adjAud(w)};
}

function colorItem(w, slug = null, audSlug = null) {
  const resolvedSlug = slug || slugify(w);
  const resolvedAud = audSlug || resolvedSlug;
  return {w, img:generatedImg('vocab', resolvedSlug), aud:'audio/' + resolvedAud + '.mp3'};
}

function w(w) { return w; }
function img(w,p) { return {w,img:p,aud:'audio/'+w.toLowerCase()+'.mp3'}; }
function adj(w) { return adjItem(w); }

const BLOCKED_WORDS = new Set([
  "chicken",
  "strawberry",
  "water",
  "candy",
  "ear",
  "arm",
  "eat",
  "long",
  "dog",
  "head",
  "small",
  "tall",
  "wide",
  "fast",
  "get_up",
  "bath_time",
  "goodbye",
  "see_you_later",
  "my_name_is",
  "nice_to_meet_you",
  "please",
  "thank_you",
  "you_re_welcome",
  "sorry",
  "more_please",
  "no_more",
  "line_up",
  "good_job",
  "well_done",
  "you_can_do_it",
  "what_s_that",
  "go_there",
  "wait",
  "show_me"
]);

function isBlockedWord(word) {
  return !!word && BLOCKED_WORDS.has(slugify(word.w || ''));
}

function visibleWords(words) {
  return words.filter(word => !isBlockedWord(word));
}

// ═══════════════════════════════════════════
//  WEB AUDIO API — reliable on mobile Safari
// ═══════════════════════════════════════════
let audioCtx = null;
let currentSource = null;
let cnPlayTimer = null;

function ensureAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
const state = {
  mainCat: 'all',      // 'all' or any key from DATA
  subCat: null,        // sub-category key (e.g. 'touch') or null for flat categories
  index: 0,
  autoplay: false,
  autoplayTimer: null,
  volume: 0.8
};

// ═══════════════════════════════════════════
//  COMPUTED
// ═══════════════════════════════════════════
function getCurrentWords() {
  if (state.mainCat === 'all') {
    // All words from all categories
    let all = [];
    for (const key in DATA) {
      const cat = DATA[key];
      if (cat.subcats) {
        for (const sk in cat.subcats) {
          all = all.concat(cat.subcats[sk].words);
        }
      } else {
        all = all.concat(cat.words);
      }
    }
    return visibleWords(all);
  }
  const cat = DATA[state.mainCat];
  if (!cat) return [];
  if (cat.subcats) {
    if (state.subCat && cat.subcats[state.subCat]) {
      return visibleWords(cat.subcats[state.subCat].words);
    }
    // Default to first subcat
    const firstKey = Object.keys(cat.subcats)[0];
    if (firstKey) {
      // Auto-set subCat if not set
      if (!state.subCat) state.subCat = firstKey;
      return visibleWords(cat.subcats[firstKey].words);
    }
    return [];
  }
  return visibleWords(cat.words);
}

function getCurrentWord() {
  const words = getCurrentWords();
  return words.length > 0 ? words[state.index] : null;
}

function getTotal() {
  return getCurrentWords().length;
}

function getCategoryClass() {
  const map = {animal:'animal', color:'color', body:'body', food:'food', home:'home', actions:'actions', phrases:'feelings'};
  if (state.mainCat === 'all') return 'all';
  return map[state.mainCat] || 'all';
}

function getBackgroundClass() {
  return getCategoryClass() + '-bg';
}

// ═══════════════════════════════════════════
//  VIEW
// ═══════════════════════════════════════════
const $ = id => document.getElementById(id);
const IMAGES_ENABLED = true;

function imageClass(path) {
  const lower = String(path || '').toLowerCase();
  if (lower.includes('/generated/')) return 'generated-asset';
  if (/\.(jpg|jpeg|png|gif)$/.test(lower)) return 'photo-asset';
  return 'vector-asset';
}

function alternateImageSrc(src) {
  if (!src) return null;
  const qIndex = src.indexOf('?');
  const base = qIndex >= 0 ? src.slice(0, qIndex) : src;
  const query = qIndex >= 0 ? src.slice(qIndex) : '';
  if (base.endsWith('.svg')) return base.slice(0, -4) + '.png' + query;
  if (base.endsWith('.png')) return base.slice(0, -4) + '.jpg' + query;
  if (base.endsWith('.jpg')) return base.slice(0, -4) + '.png' + query;
  return null;
}

function fallbackGradient(cls) {
  const gradients = {
    animal: 'linear-gradient(135deg,#1f3f63,#2f6fa1,#2c8d83)',
    color: 'linear-gradient(135deg,#612b92,#c0438a,#ff7a59)',
    fruit: 'linear-gradient(135deg,#22543d,#2f855a,#e53e3e)',
    sensory: 'linear-gradient(135deg,#553c9a,#805ad5,#d53f8c)',
    size: 'linear-gradient(135deg,#1d4ed8,#0ea5e9,#14b8a6)',
    feelings: 'linear-gradient(135deg,#be185d,#f97316,#ef4444)',
    logic: 'linear-gradient(135deg,#312e81,#2563eb,#0891b2)',
    body: 'linear-gradient(135deg,#9f1239,#ef4444,#fb7185)',
    food: 'linear-gradient(135deg,#4d7c0f,#84cc16,#f59e0b)',
    home: 'linear-gradient(135deg,#7c6f16,#ca8a04,#facc15)',
    actions: 'linear-gradient(135deg,#1d4ed8,#2563eb,#06b6d4)',
    all: 'linear-gradient(135deg,#1d3557,#6d2e8b,#1f7a63)'
  };
  return gradients[cls] || gradients.all;
}

function fallbackStage(word, cls) {
  const emoji = word && word.emoji ? `<div class="fallback-emoji">${word.emoji}</div>` : '';
  const label = word ? `<div class="fallback-chip">${word.w}</div>` : '<div class="fallback-chip">?</div>';
  return `<div class="fallback-stage" style="--fallback-bg:${fallbackGradient(cls)}">${emoji}${label}</div>`;
}

function render() {
  const word = getCurrentWord();
  const total = getTotal();
  const cls = getCategoryClass();
  const imgCard = $('img-card');

  // Image card content — use img-container to avoid destroying overlay children
  const imgContainer = $('img-container');
  imgContainer.className = '';
  imgCard.classList.remove('no-image-stage');
  if (word) {
    if (IMAGES_ENABLED && word.img) {
      if (imageClass(word.img) === 'photo-asset') imgContainer.className = 'photo-stage';
      imgContainer.innerHTML = `<img class="${imageClass(word.img)}" src="${word.img}" alt="${word.w}">`;
      const img = imgContainer.querySelector('img');
      if (img) {
        img.addEventListener('error', () => {
          const fallback = alternateImageSrc(img.src);
          if (fallback && img.dataset.altTried !== '1') {
            img.dataset.altTried = '1';
            img.src = fallback;
            return;
          }
          imgCard.classList.add('no-image-stage');
          imgContainer.className = 'no-image-stage';
          imgContainer.innerHTML = fallbackStage(word, cls);
        }, {once: true});
      }
    } else {
      imgCard.classList.add('no-image-stage');
      imgContainer.className = 'no-image-stage';
      imgContainer.innerHTML = fallbackStage(word, cls);
    }
  } else {
    imgCard.classList.add('no-image-stage');
    imgContainer.className = 'no-image-stage';
    imgContainer.innerHTML = fallbackStage(null, cls);
  }

  // Word text
  const wt = $('word-text');
  if (word) {
    wt.textContent = word.w;
    wt.className = cls + '-text';
  } else {
    wt.textContent = '';
    wt.className = '';
  }

  // Counter
  $('idx-num').textContent = total > 0 ? (state.index + 1) : 0;
  $('total-num').textContent = total;

  // Background
  document.body.className = getBackgroundClass();

  // Main tabs — rebuild to keep active state in sync
  renderMainTabs();

  // Sub-tabs
  renderSubTabs();
}

function renderMainTabs() {
  const container = $('tabs');
  const keys = Object.keys(DATA);
  // Build tabs: 'All' first, then each category
  let html = `<button class="tab${state.mainCat === 'all' ? ' active' : ''}" data-cat="all">🌍 All</button>`;
  for (const k of keys) {
    const cat = DATA[k];
    html += `<button class="tab${k === state.mainCat ? ' active' : ''}" data-cat="${k}">${cat.label}</button>`;
  }
  container.innerHTML = html;
  // Re-bind tab clicks
  container.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => setMainCat(btn.dataset.cat));
  });
  // Scroll active tab into view
  const activeTab = container.querySelector('.tab.active');
  if (activeTab) activeTab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

function renderSubTabs() {
  const container = $('sub-tabs');
  const cat = DATA[state.mainCat];
  if (!cat || !cat.subcats) {
    container.innerHTML = '';
    return;
  }
  const keys = Object.keys(cat.subcats);
  container.innerHTML = keys.map(k =>
    `<button class="sub-tab${k === state.subCat ? ' active' : ''}" data-sub="${k}">${cat.subcats[k].label}</button>`
  ).join('');

  // Re-bind sub-tab clicks
  container.querySelectorAll('.sub-tab').forEach(btn => {
    btn.addEventListener('click', () => setSubCat(btn.dataset.sub));
  });
  // Scroll active sub-tab into view
  const activeSub = container.querySelector('.sub-tab.active');
  if (activeSub) activeSub.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

function bounceCard() {
  const c = $('img-card');
  if (!c) return;
  c.style.transform = 'scale(.92)';
  setTimeout(() => c.style.transform = 'scale(1.05)', 100);
  setTimeout(() => c.style.transform = 'scale(1)', 220);
}

function popText() {
  const t = $('word-text');
  if (!t) return;
  t.classList.remove('pop');
  void t.offsetWidth;
  t.classList.add('pop');
}

function confetti(n) {
  n = n || 20;
  const colors = ['#ff6b6b','#ffd700','#a55eea','#4ade80','#60a5fa','#fbbf24','#ff9ff3','#ff6348'];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'confetti-piece';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.top = '-20px';
    d.style.background = colors[Math.floor(Math.random() * colors.length)];
    d.style.width = (6 + Math.random() * 12) + 'px';
    d.style.height = (6 + Math.random() * 12) + 'px';
    d.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
    d.style.animationDelay = Math.random() * 0.4 + 's';
    d.style.animationDuration = (1 + Math.random() * 1.2) + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2000);
  }
}

function toggleAutoplayUI(on) {
  $('autoplay').textContent = on ? '⏸' : '▶';
  $('autoplay').classList.toggle('active', on);
}

// ═══════════════════════════════════════════
//  CONTROLLER
// ═══════════════════════════════════════════

function setMainCat(cat) {
  if (cat === state.mainCat) return;
  state.mainCat = cat;
  state.subCat = null;
  state.index = 0;
  render();
  if (state.autoplay) scheduleAutoplay();
}

function setSubCat(sub) {
  state.subCat = sub;
  state.index = 0;
  render();
  if (state.autoplay) scheduleAutoplay();
}

function prev() {
  const total = getTotal();
  if (total === 0) return;
  state.index = state.index > 0 ? state.index - 1 : total - 1;
  render();
  if (state.autoplay) scheduleAutoplay();
}

function next() {
  const total = getTotal();
  if (total === 0) return;
  state.index = state.index < total - 1 ? state.index + 1 : 0;
  render();
  if (state.autoplay) scheduleAutoplay();
}

function tapWord() {
  const word = getCurrentWord();
  if (!word) return;
  playAudio();
  confetti(20);
  bounceCard();
  popText();
}

function playAudio() {
  const word = getCurrentWord();
  if (!word) return;
  if (!word.aud) return;
  
  // Stop any current playback
  if (currentSource) {
    try { currentSource.stop(); } catch(e) {}
    currentSource = null;
  }
  // Cancel any pending Chinese playback from previous word
  if (cnPlayTimer) {
    clearTimeout(cnPlayTimer);
    cnPlayTimer = null;
  }
  
  const ctx = ensureAudioCtx();
  
  fetch(word.aud)
    .then(r => {
      if (!r.ok) throw new Error('fetch failed');
      return r.arrayBuffer();
    })
    .then(buf => ctx.decodeAudioData(buf))
    .then(audioBuffer => {
      const source = ctx.createBufferSource();
      source.buffer = audioBuffer;
      const gain = ctx.createGain();
      gain.gain.value = state.volume;
      source.connect(gain);
      gain.connect(ctx.destination);
      source.start(0);
      currentSource = source;
      
      source.onended = () => {
        currentSource = null;
        // Play Chinese audio after 500ms delay (for ALL words)
        if (cnPlayTimer) clearTimeout(cnPlayTimer);
        cnPlayTimer = setTimeout(() => {
          const cnPath = word.aud.replace('audio/', 'audio_cn/');
          fetch(cnPath)
            .then(r => { if (!r.ok) throw new Error('no cn'); return r.arrayBuffer(); })
            .then(buf => ctx.decodeAudioData(buf))
            .then(cnBuf => {
              const cnSource = ctx.createBufferSource();
              cnSource.buffer = cnBuf;
              const cnGain = ctx.createGain();
              cnGain.gain.value = state.volume;
              cnSource.connect(cnGain);
              cnGain.connect(ctx.destination);
              cnSource.start(0);
              cnSource.onended = () => {
                if (state.autoplay) setTimeout(() => next(), 600);
              };
            })
            .catch(() => {
              // No Chinese audio — advance autoplay if needed
              if (state.autoplay) setTimeout(() => next(), 600);
            });
        }, 500);
      };
    })
    .catch(() => {});
}

function toggleAutoplay() {
  state.autoplay = !state.autoplay;
  toggleAutoplayUI(state.autoplay);
  if (state.autoplay) scheduleAutoplay();
  else {
    clearTimeout(state.autoplayTimer);
    if (currentSource) {
      try { currentSource.stop(); } catch(e) {}
      currentSource = null;
    }
  }
}

function scheduleAutoplay() {
  clearTimeout(state.autoplayTimer);
  state.autoplayTimer = setTimeout(() => {
    tapWord();
    // Don't hard-code next() — audio ended event handles advancement
  }, 800);
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
function init() {
  if (init.done) return;
  init.done = true;

  // Ensure AudioContext is resumed on first user interaction
  document.addEventListener('touchstart', () => ensureAudioCtx(), {once: true});
  document.addEventListener('click', () => ensureAudioCtx(), {once: true});

  // Build main tabs dynamically from DATA
  renderMainTabs();

  // Arrow clicks
  $('arrow-left').addEventListener('click', prev);
  $('arrow-right').addEventListener('click', next);

  // Card click → play audio
  $('img-card').addEventListener('click', function(e) {
    // Don't trigger if clicking on arrow or autoplay buttons
    if (e.target.closest('.arrow') || e.target.closest('#autoplay')) return;
    tapWord();
  });

  // Word text click → also play (stop propagation to avoid double-fire with card)
  $('word-text').addEventListener('click', function(e) { e.stopPropagation(); tapWord(); });

  // Autoplay
  $('autoplay').addEventListener('click', toggleAutoplay);

  // Swipe
  let tx = 0;
  $('main-area').addEventListener('touchstart', e => { tx = e.touches[0].clientX; });
  $('main-area').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 50) {
      dx < 0 ? next() : prev();
    }
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'ArrowRight') next();
    if (e.key === ' ') { e.preventDefault(); tapWord(); }
  });

  // Volume long-press on counter
  let pt;
  $('counter').addEventListener('pointerdown', () => {
    pt = setTimeout(() => {
      state.volume = state.volume > 0.5 ? 0.2 : 0.8;
      playAudio();
    }, 2500);
  });
  $('counter').addEventListener('pointerup', () => clearTimeout(pt));
  $('counter').addEventListener('pointerleave', () => clearTimeout(pt));

  // Random start
  const total = getTotal();
  if (total > 0) state.index = Math.floor(Math.random() * total);

  // Initial render
  render();
}

// Boot
document.addEventListener('DOMContentLoaded', init);
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  init();
}
</script>
