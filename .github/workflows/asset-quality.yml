name: Asset Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  semantic-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_semantic_audit.py --fail-on-weak
      - run: python scripts/check_website_assets.py
